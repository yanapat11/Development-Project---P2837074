<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout | PAT Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="project.css">
  <link rel="stylesheet" href="responsive.css">
</head>

<body>

<section id="header">
  <a href="project.html"><img src="img/patlo.png" class="logo" alt=""></a>

  <div>
    <ul id="navbar">
      <li><a href="project.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li id="lg-bag">
        <a class="active" href="cart.html"><i class="fa-solid fa-bag-shopping"></i></a>
      </li>
    </ul>
  </div>
</section>

<section id="page-header">
  <h2>Checkout</h2>
  <p>Complete your order details</p>
</section>

<section id="cart-add" class="section-p1">

  <div id="Coupon">
    <h3>Delivery Details</h3>

    <form id="checkout-form">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <textarea name="address" placeholder="Delivery Address" required style="width:100%; height:120px; padding:10px; margin-top:10px;"></textarea>

      <button class="normal" type="submit" style="margin-top:15px;">Place Order</button>
    </form>
  </div>

  <div id="Subtotal">
    <h3>Payment</h3>

    <table>
      <tr>
        <td>Payment Method</td>
        <td>Card / Demo Checkout</td>
      </tr>
      <tr>
        <td>Shipping</td>
        <td>Free</td>
      </tr>
      <tr>
        <td><strong>Status</strong></td>
        <td><strong>Ready</strong></td>
      </tr>
    </table>

    <button class="normal" id="stripe-btn" type="button">Pay with Stripe</button>
  </div>

</section>

<footer class="section-p1">
  <div class="col">
    <img src="img/logo.png" alt="">
    <h4>Contact</h4>
    <p><strong>Address: </strong>2 Eastern Blvrd, Leicester</p>
    <p><strong>Phone: </strong>+44 7442 346423</p>
    <p><strong>Hours:</strong>10:00 - 18:00, Mon - Sat</p>
  </div>

  <div class="copyright">
    <p>@ 2026, PAT etc </p>
  </div>
</footer>

<script>
  document.querySelector("#checkout-form").addEventListener("submit", async (event) => {
    event.preventDefault();

    const formData = new FormData(event.target);

    const response = await fetch("/api/checkout", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(Object.fromEntries(formData.entries()))
    });

    const data = await response.json();

    if (response.ok) {
      alert(`Order placed successfully. Order number: ${data.orderId}`);
      window.location.href = "shop.html";
    } else {
      alert(data.error || "Could not place order");
    }
  });

  document.querySelector("#stripe-btn").addEventListener("click", async () => {
    const response = await fetch("/api/create-payment-session", {
      method: "POST"
    });

    const data = await response.json();

    if (data.url) {
      window.location.href = data.url;
    } else {
      alert(data.error || "Payment system is currently unavailable.");
    }
  });
</script>

</body>
</html>
