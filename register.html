<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register | PAT Store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="project.css">
  <link rel="stylesheet" href="responsive.css">
</head>

<body>

<section id="header">
  <a href="project.html"><img src="img/patlo.png" class="logo" alt=""></a>

  <div>
    <ul id="navbar">
      <li><a href="project.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li id="lg-bag">
        <a href="cart.html"><i class="fa-solid fa-bag-shopping"></i></a>
      </li>
    </ul>
  </div>
</section>

<section id="page-header">
  <h2>Create Account</h2>
  <p>Join PAT Store and start shopping</p>
</section>

<section id="cart-add" class="section-p1">

  <div id="Coupon">
    <h3>Register</h3>

    <form id="register-form">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email Address" required>
      <input type="password" name="password" placeholder="Password (minimum 6 characters)" required>

      <button class="normal" type="submit" style="margin-top:15px;">Create Account</button>
    </form>
  </div>

  <div id="Subtotal">
    <h3>Already Registered?</h3>
    <button class="normal" onclick="window.location.href='login.html'">Login</button>
  </div>

</section>

<footer class="section-p1">
  <div class="col">
    <img src="img/logo.png" alt="">
    <h4>Contact</h4>
    <p><strong>Address: </strong>2 Eastern Blvrd, Leicester</p>
    <p><strong>Phone: </strong>+44 7442 346423</p>
    <p><strong>Hours:</strong>10:00 - 18:00, Mon - Sat</p>
  </div>

  <div class="copyright">
    <p>@ 2026, PAT etc </p>
  </div>
</footer>

<script>
  document.querySelector("#register-form").addEventListener("submit", async (event) => {
    event.preventDefault();

    const formData = new FormData(event.target);

    const response = await fetch("/api/auth/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(Object.fromEntries(formData.entries()))
    });

    const data = await response.json();

    if (response.ok) {
      alert("Registered successfully");
      window.location.href = "project.html";
    } else {
      alert(data.error || "Register failed");
    }
  });
</script>

</body>
</html>
